services:
  rag-api:
    build: .
    image: rag-knowledge-base:latest
    container_name: rag-knowledge-base
    env_file:
      - .env
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      DATA_DIR: /app/data
      CHROMA_DIR: /app/chroma_db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
    restart: unless-stopped
