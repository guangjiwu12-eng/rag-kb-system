    - doc: GB51251-2017_建筑防烟排烟系统技术标准.pdf
      page: 50
      anchor: 补风系统应直接从室外引入空气， 且补风量不应小于排烟量的50%
      alternate: true   # GB51251 4.5.2/4.5.6：同一要求在本标准里的量化表述
  note: >-
    回库核对成立，但性质与 n9/n12 略有不同：GB55036 是原则性规定（「满足排烟系统有效
