    全库只有 GB51251 一处出现「偏差不大于设计值的10%」（第 79 页调试、第 86 页验收各一次，
    同一部标准）。GB55036 的字面出现在第 44～45 页，讲的是余压值 25~50Pa 和送风量，
    压根没有这个 10%——那是**同章节相邻条款的干扰**，不是同义承载。
    标成 alternate 会把「检索选错了条款」洗成「口径问题」。

