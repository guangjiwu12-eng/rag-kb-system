# 评测题库
#
# 出题规则
# --------
# 1. anchor 必须是从 chunk 里**原样复制**的一段唯一原文（建议 20-40 字）。
#    不要改写、不要跨段拼接——它是用来反查 chunk 的指纹。
#    写完用 eval 启动时的告警验证唯一性：标了 2 处就换更长的子串。
#    注意 chunk_overlap=150 会让相邻切片共享一段文字，落在重叠区的句子天然不唯一，
#    这类句子要么标两个 gold，要么换掉。
# 2. page 用 PDF 阅读器里看到的页码（从 1 开始），TXT 填 null 或省略。
# 3. 无答案题必须「主题沾边、事实不存在」：文档讲了卷帘下降位置，就问它的下降速度标准；
#    文档提到"核对设备型号"，就问具体型号是什么。问不相干的主题测的是模型常识，不是拒答。
# 4. 目标配比 40 有答案 + 10 无答案。q001-q036 是第一批（扩库前、只有实践日志一个文档时
#    出的 14 道），n1-n36 是扩库后按最终库补的第二批——**出题必须基于最终库**，否则扩库
#    之后 gold 锚点全部落空。落在 chunk_overlap 区、能同时命中相邻两个切片的句子标两个
#    gold（用 page 区分），不要为了「唯一」把锚点改写成不像原文的句子。
#
# 5. 一条 gold 可以标 `alternate: true`：表示「同一事实的另一个合法承载文档」。
#    它在宽松口径里算命中，在严格口径里不算，报告两套数并列。
#    **加这个标记前必须回库核对原文**（用 scripts/find_carriers.py），确认是「同一条
#    规定」而不是「同一个主题」——数值、适用对象、限定条件都要对得上。
#    反例见 n20：GB55036 讲的是余压值 25~50Pa，压根没有那个 10%，标成 alternate 就
#    把「检索选错条款」洗成了「口径问题」。每个 alternate 的题都要在 note 里写依据。
#
# 6. 严格口径下 gold 里至少要有一个不带 alternate 的锚点（主承载），否则分母为空。
#
# 校验方式：python eval/eval.py --no-query
# 报告里「锚点未解析 / 降级匹配」的告警就是在告诉你标注写错了。

# ---------------------------------------------------------------- 有答案（10）
- id: q001
  question: 防火分区内烟感探测器报警后，防火卷帘会下降到什么位置？
  answer: 先下降至距地面 1.8 米处；待温感探测器报警后才降至地面，关闭防火分区。
  type: answerable
  gold:
    - doc: 实践日志.pdf
      page: 8
      anchor: 防火卷帘会下降至距地面 1.8 米处

- id: q002
  question: 这份实践日志对实践天数的最低要求是多少天？
  answer: 不少于 15 天，且每天实践内容不少于 200 字。
  type: answerable
  gold:
    - doc: 实践日志.pdf
      page: 2
      anchor: 实践天数不少于 15 天

- id: q003
  question: 全系统联动测试时部分区域喷淋泵启动延迟，排查出的原因是什么？
  answer: 联动控制器的联动延时参数设置不合理，调整参数后喷淋泵启动正常。
  type: answerable
  gold:
    - doc: 实践日志.pdf
      page: 12
      anchor: 是联动控制器的联动延时参数设置不合理

- id: q004
  question: 系统稳定性测试持续运行了多长时间？
  answer: 4 小时，期间模拟不同报警信号观察运行状态。
  type: answerable
  gold:
    - doc: 实践日志.pdf
      page: 14
      anchor: 将系统设置为自动联动模式，持续运行 4 小时

- id: q005
  question: 验收小组在现场测试时发现了哪些不符合项？
  answer: 1 处应急广播音量不符合要求，2 处探测器报警灵敏度偏差较大。
  type: answerable
  gold:
    - doc: 实践日志.pdf
      page: 16
      anchor: 1 处应急广播的音量不符合要求

- id: q006
  question: 喷淋泵联动启动后压力不足，最终查明的原因是什么？
  answer: 进口阀门未完全打开导致进水不足，完全打开后压力恢复正常。
  type: answerable
  gold:
    - doc: 实践日志.pdf
      page: 11
      anchor: 进口阀门未完全打开

- id: q007
  question: 模拟多层火灾场景时，高层区域的排烟风机为什么没有正常启动？
  answer: 排烟风机的控制线路存在短路，切断电源修复线路后恢复正常。
  type: answerable
  gold:
    - doc: 实践日志.pdf
      page: 13
      anchor: 高层区域排烟风机的控制线路存在短路

- id: q008
  question: 消防电话联动测试中，消防电话主机实现了哪些呼叫功能？
  answer: 可自动呼叫相关负责人，通话清晰无杂音；也支持手动呼叫现场电话和外线电话。
  type: answerable
  gold:
    - doc: 实践日志.pdf
      page: 10
      anchor: 消防电话主机成功自动呼叫相关负责人

- id: q009
  question: 火灾发生时应急广播的联动逻辑是什么？
  answer: 联动控制器自动启动应急广播、播放火灾疏散指令，同时切断正常广播。
  type: answerable
  gold:
    - doc: 实践日志.pdf
      page: 9
      anchor: 联动控制器会自动启动应急广播
  note: >-
    **不加 alternate**。原归因说「gold 标错，该改标规范」，回库核对**只对一半**：
    规范侧没有任何一片能单独承载这个完整逻辑——GB50116 第 32 页 4.8.8 只说「联动控制
    信号应由消防联动控制器发出」，4.8.12 另说「合用时应有强制切入功能」，两条合起来才
    等价于日志里那句话；单独把任一条标成 alternate，等于让「只答对一半」算命中。
    所以这是**多跳 + 文体不匹配**（口语复述 vs 规范条款），不是标注口径问题。
    要救只能靠查询改写或 rerank，改标注是作弊。

- id: q010
  question: 7-10 层有 3 个烟感探测器无法注册，逐个排查的结果是什么？
  answer: 编码均无误；2 个是接线松动，重新紧固后完成注册；1 个存在硬件故障，标记后联系维修更换。
  type: answerable
  gold:
    - doc: 实践日志.pdf
      page: 6
      anchor: 3 个烟感探测器无法正常注册

