# 10 题 smoke 子集：提交前跑一次（一两分钟），足够发现「指标掉了」。
#
# 选题原则：
# - 只挑当前已命中的题，smoke 失败才等于回归，而不是撞上已知难点；
# - 覆盖 7 部不同文档，避免「某一篇没入库」这类问题被漏掉；
# - 3 道无答案题留在里面，题库结构也要跟正式库一致。
#
# ⚠️ 这套题的数字只判绝对下限（eval/smoke_floors.json），不要拿去和 50 题的
#    eval/baseline.json 对比——题集不同，diff_eval.py 的差值没有意义。
#    改题库后同步重跑：bash scripts/smoke_eval.sh

- id: q001
  question: 防火分区内烟感探测器报警后，防火卷帘会下降到什么位置？
  answer: 先下降至距地面 1.8 米处；待温感探测器报警后才降至地面，关闭防火分区。
  type: answerable
  gold:
    - doc: 实践日志.pdf
      page: 8
      anchor: 防火卷帘会下降至距地面 1.8 米处

- id: n1
  question: 消防控制室每班工作时间和每班人员数量是怎么规定的？
  answer: 每班工作时间不大于 8h，每班人员不少于 2 人；并且实行每日 24h 值班制度。
  type: answerable
  gold:
    - doc: GB25201-2010_建筑消防设施的维护管理.pdf
      page: 3
      anchor: 每班工作时间应不大于8h，每班人员应不少于2人

- id: n4
  question: 不设高位消防水箱时，气压供水设备的有效水容积按什么确定？
  answer: 按系统最不利处 4 只喷头在最低工作压力下的 5min 用水量确定。
  type: answerable
  gold:
    - doc: GB50084-2017_自动喷水灭火系统设计规范.pdf
      page: 79
      anchor: 应按系统最不利处4只喷头在最低工作压力下的5min用水量确定

- id: n6
  question: 排烟风机入口处总管上的排烟防火阀动作后，应如何联动风机？
  answer: 280℃ 排烟防火阀在关闭后应直接联动控制风机停止。
  type: answerable
  gold:
    - doc: GB50116-2013_火灾自动报警系统设计规范.pdf
      page: 28
      anchor: 280℃ 排烟防火阀在关闭后应直接联动控制风机

- id: n14
  question: 防火卷帘下部、常开式防火门门口等部位多久检查一次？
  answer: 每日应对防火卷帘下部、常开式防火门门口处、活动式防火窗窗口处检查一次，并清除妨碍设备启闭的物品。
  type: answerable
  gold:
    - doc: GB50877-2014_防火卷帘防火门防火窗施工及验收规范.pdf
      page: 28
      anchor: 每日应对防火卷帘下部、常开式防火门门口处、活动式防火窗窗口处进行一次检查

- id: n17
  question: 消防水泵控制柜与水泵设置在同一空间时，防护等级不应低于多少？
  answer: 不应低于 IP55（设在专用控制室时不应低于 IP30）。
  type: answerable
  gold:
    - doc: GB50974-2014_消防给水及消火栓系统技术规范.pdf
      page: 97
      anchor: 与消防水泵设置在同一空间时，其防护等级不应低于IP55

- id: n22
  question: 一台应急照明控制器直接控制的灯具总数量上限是多少？
  answer: 不应大于 3200 只；超过时应设置多台控制器。
  type: answerable
  gold:
    - doc: GB51309-2018_消防应急照明和疏散指示系统技术标准.pdf
      page: 26
      anchor: 任一台应急照明控制器直接控制灯具的总数量不应大于3200

- id: q012
  question: 防火卷帘产品的保修期是多少年？
  answer: 标准只要求检测记录里填写"保修情况"，没有规定保修年限。
  type: unanswerable
  note: 原题问"卷帘下降速度是多少米每秒"，被判为无答案；扩库后 GB50877-2014 第 22 页写明"电动启、闭的运行速度应为 2m/min～7.5m/min"，模型据实回答还被记成幻觉。旧的"无答案"标注会被新语料推翻，扩库后必须复核这一批。

- id: n32
  question: 自动喷水灭火系统每平方米的安装造价是多少？
  answer: 规范只规定设计参数与施工验收要求，不涉及造价。
  type: unanswerable
  note: 喷淋

- id: n35
  question: 建筑消防设施年度检测的收费依据和标准是什么？
  answer: 文档规定检测频次与内容，不涉及收费。
  type: unanswerable
  note: 检测收费
